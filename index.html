<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>유상록과의 채팅</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body>
<div class="phone-wrap">
  <header class="chat-header">
    <button class="back" type="button" onclick="location.href='../team/index.html'">‹</button>
    <div class="header-avatar">
      <img alt="유상록 프로필" data-profile-image="dbtkdfhr">
    </div>
    <div class="header-info">
      <div class="header-name">유상록</div>
      <div class="header-status">복잡한 문제를 작고 선명한 인터페이스로 바꾸는 개발자</div>
    </div>
    <div class="header-icons">
      <span>🔍</span>
      <span>☰</span>
    </div>
  </header>

  <main class="chat-body" id="chatBody">
    <div class="date-divider"><span>2026년 5월 29일 금요일</span></div>
    <section class="profile-card">
      <img alt="유상록 프로필" data-profile-image="dbtkdfhr">
      <div>
        <strong>유상록 · 이력서</strong>
        <p>프론트엔드의 감각, 백엔드의 구조, 빠른 실험으로 쓰기 좋은 서비스를 만듭니다.</p>
      </div>
    </section>
  </main>

  <section class="quick-replies" aria-label="빠른 질문">
    <button data-question="이력서">이력서</button>
    <button data-question="자기소개">자기소개</button>
    <button data-question="기술스택">기술스택</button>
    <button data-question="프로젝트">프로젝트</button>
    <button data-question="관심사">관심사</button>
    <button data-question="연락처">연락처</button>
  </section>

  <footer class="chat-input-bar">
    <span class="input-icon">+</span>
    <input class="input-field" id="inputField" placeholder="유상록에게 물어보기"/>
    <button class="send-btn" id="sendBtn" type="button">➤</button>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
